[package]
name = "easym"
version = "1.0.0"
description = "A local-first Markdown desktop editor"
authors = ["EasyM contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "easym_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2"] }
quick-xml = "=0.42.0"
same-file = "=1.0.6"
# v2 sync (step 3): WebDAV over rustls with platform certificate verification; no native-tls,
# cookies, proxies-from-env redirects or compression. Redirects are disabled in code.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"] }
tokio = { version = "1", default-features = false, features = ["time"] }
keyring = { version = "=3.6.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_Shell"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
