# Minimal mod_dav_fs target for EasyM protocol verification (loopback HTTP only).
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule dav_lock_module modules/mod_dav_lock.so

DavLockDB /srv/dav/lock/DavLock
# Keep the 2.4 default validator (size + mtime). The probe records whether it is strong and changes per write.
FileETag MTime Size

Alias /dav /srv/dav/root
<Directory /srv/dav/root>
  Dav On
  Options None
  AllowOverride None
  AuthType Basic
  AuthName "EasyM WebDAV verification"
  AuthBasicProvider file
  AuthUserFile /usr/local/apache2/conf/easym.htpasswd
  Require valid-user
  LimitRequestBody 33554432
</Directory>
