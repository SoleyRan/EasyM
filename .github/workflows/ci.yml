name: Validate EasyM

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm verify:release
      - run: pnpm test --maxWorkers=2
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:regression
      - name: Verify search with a slower browser
        run: pnpm verify:search --slow
      - name: Verify templates with a slower browser
        run: pnpm verify:templates --slow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            test-results/browser-verification.json
            test-results/docx-library-verification.json
            test-results/docx-verification.json
            test-results/docx-ui-verification.json
            test-results/docx-ui/*.png
            test-results/history-verification.json
            test-results/history-diff-performance.json
            test-results/history/*.png
            test-results/batch-images-verification.json
            test-results/batch-images/*.png
            test-results/writing-verification.json
            test-results/search-verification.json
            test-results/search-slow-verification.json
            test-results/search-failure.png
            test-results/live-preview-verification.json
            test-results/workspace-verification.json
            test-results/templates-verification.json
            test-results/templates-slow-verification.json
            test-results/templates-failure.png
            test-results/export-verification.json
            test-results/extensions-verification.json
            test-results/extensions/*
            test-results/math-verification.json
            test-results/math/*
            test-results/mermaid-verification.json
            test-results/mermaid/*
            test-results/context-menu-verification.json
            test-results/commands-verification.json
            test-results/tables-verification.json
            test-results/tables/*.png
            test-results/content-tools-verification.json
            test-results/content-tools/*.png
            test-results/quick-entry-verification.json
            test-results/quick-entry/*.png
            test-results/appearance-verification.json
            test-results/appearance/*.png
            test-results/session-verification.json
            test-results/session/*.png
            test-results/recent-verification.json
            test-results/recent/*.png
            test-results/external-verification.json
            test-results/external/*.png
            test-results/settings-verification.json
            test-results/regression-verification.json
          if-no-files-found: warn

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:workers
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Collect platform dependency notices
        shell: bash
        env:
          EASYM_STRICT_LICENSES: ${{ runner.os != 'macOS' }}
        run: |
          mkdir -p test-results
          pnpm licenses list --prod --json > test-results/npm-licenses.json
          target=$(rustc -vV | awk '/^host:/ {print $2}')
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --filter-platform "$target" --format-version 1 > test-results/cargo-metadata.json
          node scripts/generate-notices.mjs test-results/npm-licenses.json test-results/cargo-metadata.json Docs/dependencies "$target"
          node scripts/verify-notices.mjs Docs/dependencies
          node scripts/verify-release-metadata.mjs
      - run: pnpm tauri build --no-bundle
      - name: Verify Windows native startup and close
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-native-startup.ps1
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri bundle --bundles nsis --no-binary-patching
      - name: Verify Windows installation and removal
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-installer.ps1
      - name: Build and verify Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - name: Upload installer diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-verification
          path: |
            test-results/installer-verification.json
            test-results/native-startup-verification.json
            test-results/portable-verification.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: easym-${{ runner.os }}-development
          path: |
            src-tauri/target/release/easym.exe
            src-tauri/target/release/easym
            Docs/dependencies/
            test-results/installer-verification.json
            test-results/native-startup-verification.json
            test-results/portable-verification.json
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/portable/*.zip
          if-no-files-found: error
