name: Draft EasyM release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Validate EasyM run ID for this exact commit
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: easym-release-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require successful CI on this exact commit
        id: candidate
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const runId = process.env.RUN_ID;
            if (!/^\d+$/.test(runId)) throw new Error('Invalid run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(runId)});
            const {data: workflow} = await github.rest.actions.getWorkflow({...context.repo, workflow_id: run.workflow_id});
            if (workflow.path !== '.github/workflows/ci.yml' || run.event !== 'push' || run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` || run.head_sha !== context.sha || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('A successful repository push CI run for the selected release commit is required');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...context.repo, run_id: Number(runId)});
            const candidates = artifacts.filter(item => item.name === 'easym-windows-release-candidate' && !item.expired);
            if (candidates.length !== 1) throw new Error('Expected one unexpired Windows release candidate');
            core.setOutput('artifact-id', candidates[0].id);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: candidate
          merge-multiple: true
      - name: Verify version, commit and all release hashes
        run: node scripts/prepare-release.mjs --verify candidate "$GITHUB_SHA"
      - name: Create draft with the tested artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('candidate/release-manifest.json', 'utf8'));
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (manifest.version !== pkg.version) throw new Error('Repository version mismatch');
            const tag = `v${manifest.version}`;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            if (releases.some(release => release.tag_name === tag)) throw new Error('Release already exists; review it rather than replacing assets');
            try {
              const {data: ref} = await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
              let object = ref.object;
              while (object.type === 'tag') object = (await github.rest.git.getTag({...context.repo, tag_sha: object.sha})).data.object;
              if (object.type !== 'commit' || object.sha !== context.sha) throw new Error('Existing tag points at another commit');
            } catch (error) { if (error.status !== 404) throw error; }
            const notes = fs.readFileSync('candidate/RELEASE-NOTES.md', 'utf8');
            const {data: release} = await github.rest.repos.createRelease({...context.repo, tag_name: tag, target_commitish: context.sha, name: `EasyM ${manifest.version}`, draft: true, prerelease: false, body: notes + `\n\nCandidate commit: ${context.sha}\nCI: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}\n\nDraft only: confirm the manual acceptance checklist and unsigned Windows distribution before publishing.\n`});
            for (const name of [...manifest.artifacts.map(item => item.name), 'release-manifest.json', 'SHA256SUMS.txt']) {
              const data = fs.readFileSync(`candidate/${name}`);
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, name, data, headers: {'content-type': 'application/octet-stream', 'content-length': data.length}});
            }
            await core.summary.addLink('Review the release draft', release.html_url).write();
        env:
          RUN_ID: ${{ inputs.run_id }}
